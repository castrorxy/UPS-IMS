{% extends "base.html" %}
{% block content %}
<style>
  .login-full {
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 72px 20px 40px;
    background: linear-gradient(180deg, #fbfbfd 0%, #f6f7fb 100%);
  }
  /* removed image column; center content */
  .login-card {
    background: var(--orange);
    border-radius: 12px;
    padding: 34px 32px;
    box-shadow: 0 8px 20px rgba(17,18,26,0.04);
    border: 1px solid rgba(0,0,0,0.04);
    color: #fff;
  }
  .login-card h2 { margin: 0 0 14px; font-size: 20px; }
  .login-card label { display:block; margin-bottom:12px; font-size:13px; color:inherit }
  .login-card input[type="text"], .login-card input[type="password"] {
    width:100%; padding:12px 14px; border-radius:8px; border:1px solid rgba(0,0,0,0.06); font-size:14px;
    background:#fff; color:#111;
    box-shadow: inset 0 1px 0 rgba(0,0,0,0.02);
  }
  .password-wrap{ position:relative }
  .password-wrap .eye-btn{
    position:absolute; right:10px; top:50%; transform:translateY(-50%);
    background:#fff; border:none; cursor:pointer; width:36px; height:36px; border-radius:8px; display:grid; place-items:center;
    color:var(--orange-deep); border:1px solid rgba(0,0,0,0.06); padding:0;
  }
  .password-wrap .eye-btn svg{ width:18px; height:18px; display:block; fill:currentColor }
  .login-actions { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:14px }
  .btn-primary { background:#fff; color:var(--orange-deep); border:none; padding:10px 18px; border-radius:8px; cursor:pointer; font-weight:700 }

  /* Title styling to match sidebar but larger and softer */
  .login-title {
    text-align: center;
    font-family: "Space Grotesk", "Segoe UI", sans-serif;
    font-size: 48px;
    font-weight: 600;
    color: rgba(122,62,18,0.9);
    margin-bottom: 24px;
    letter-spacing: 0.2px;
  }
  .alert { background:#fff1f0; color:#7a1b1b; padding:10px; border-radius:6px; margin-bottom:10px; border:1px solid #ffd0cf }
  .small-muted { font-size:12px; color:#6b6f78 }

  @media (max-width:1000px){
    .login-full{ padding:28px 16px }
    .login-title{ font-size:32px }
    .login-card{ width:100%; padding:24px }
  }
</style>

<div class="login-full">
  <div style="width:100%;display:grid;place-items:center;padding:5px 10px;">
    <div style="max-width:520px;width:100%;">
      <h1 class="login-title">Inventory Management</h1>
      <form class="login-card" method="post">
        <h2 style="color:#fff;margin-bottom:12px">Sign in</h2>
        {% if error %}
          <div class="alert">{{ error }}</div>
        {% endif %}

        <label style="color:#fff;">Username
          <select name="username" required>
            <option value="">Select username</option>
            {% for u in usernames %}
            <option value="{{ u }}">{{ u }}</option>
            {% endfor %}
          </select>
        </label>

        <label style="color:#fff;">Password
          <div class="password-wrap">
            <input id="passwordInput" name="password" type="password" placeholder="Enter password" required />
            <button type="button" id="togglePassword" class="eye-btn" aria-label="Show password">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12 5c5 0 9 4 9 7s-4 7-9 7-9-4-9-7 4-7 9-7zm0 2a5 5 0 1 0 0 10A5 5 0 0 0 12 7zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/></svg>
            </button>
          </div>
        </label>

        <div class="login-actions">
          <label style="display:flex;align-items:center;gap:8px;color:#fff"><input type="checkbox" name="keep" /> <span class="small-muted">Keep me logged in</span></label>
          <button type="submit" class="btn-primary">Log in</button>
        </div>

      </form>
    </div>
  </div>
</div>

  <script>
    (function(){
      const pwd = document.getElementById('passwordInput');
      const toggle = document.getElementById('togglePassword');
      if (!pwd || !toggle) return;
      const eyeSVG = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12 5c5 0 9 4 9 7s-4 7-9 7-9-4-9-7 4-7 9-7zm0 2a5 5 0 1 0 0 10A5 5 0 0 0 12 7zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/></svg>';
      const eyeOffSVG = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M2 3l18 18-1.4 1.4L17 19.8C15.7 20.5 14 21 12 21c-5 0-9-4-9-7 0-1.1.5-2.7 1.1-3.9L.6 4.4 2 3zm10 6a5 5 0 0 1 4.6 2.9l-1.6 1.6A3 3 0 0 0 12 11c-.5 0-1 .1-1.4.3L8.7 9.4A5 5 0 0 1 12 9zm0-6c5 0 9 4 9 7 0 1.1-.5 2.7-1.1 3.9l-1.6-1.6C17.3 11.8 14.8 11 12 11c-.5 0-1 .1-1.4.3L7.1 7.8C8.2 6.8 10 5 12 3z"/></svg>';
      let showing = false;
      toggle.addEventListener('click', () => {
        showing = !showing;
        if (showing) {
          pwd.type = 'text';
          toggle.innerHTML = eyeOffSVG;
          toggle.setAttribute('aria-label','Hide password');
        } else {
          pwd.type = 'password';
          toggle.innerHTML = eyeSVG;
          toggle.setAttribute('aria-label','Show password');
        }
      });
    })();
  </script>

  {% endblock %}
